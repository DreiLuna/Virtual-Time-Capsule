version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    image: rickytruong/virtual-time-capsule-app:latest
    platform: "${DOCKER_PLATFORM:-linux/amd64}"
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
    ports:
      - "3001:3001"
    volumes:
      - uploads:/app/uploads

  client:
    image: rickytruong/virtual-time-capsule-client:latest
    platform: "${DOCKER_PLATFORM:-linux/amd64}"
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"

volumes:
  db-data:
  uploads:
